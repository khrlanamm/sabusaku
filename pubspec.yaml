name: sabusaku
description: "Sabu Saku: Satu Bulan Satu Buku"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.3

dependencies:
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  crypto: ^3.0.7
  csv: ^8.0.0
  file_picker: ^13.1.0
  firebase_analytics: ^12.6.0
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  image_cropper: ^13.0.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  freezed: ^4.0.2
  riverpod_generator: ^4.0.9
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - branding/svg/logo-mark.svg
    - branding/svg/logo-mark-reversed.svg
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "branding/png/app-icon-1024.png"
  adaptive_icon_background: "branding/png/app-icon-background-1024.png"
  adaptive_icon_foreground: "branding/png/app-icon-foreground-1024.png"
  # The foreground art already sits inside the adaptive-icon safe zone.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "branding/png/app-icon-monochrome-1024.png"

flutter_native_splash:
  color: "#17365D"
  image: "branding/png/splash-logo-with-name.png"
  android_12:
    color: "#17365D"
    image: "branding/png/splash-android12-icon.png"
